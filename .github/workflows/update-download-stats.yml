name: Update Download Statistics

on:
  schedule:
    # Runs every Monday at 6AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-downloads:
    name: Calculate and update total download count
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Calculate total downloads
        id: downloads
        run: |
          # List of npm packages to check
          packages=(
            "prisma-schema-sorter"
            "prisma-query-inspector"
            "prisma-joi-generator"
            "prisma-yup-generator"
            "prisma-class-validator-generator"
            "json-to-prisma-schema-convertor"
            "prisma-zod-generator"
            "create-trpc-appx"
            "prisma-trpc-generator"
            "prisma-json-server-generator"
            "trpc-shield"
            "prisma-trpc-shield-generator"
            "prisma-custom-models-generator"
            "graphql-shield-generator"
            "firebase-functions-downloader"
            "lang-firestore"
            "firestore-indexes-diff"
            "firestore-prisma"
            "orpc-shield"
            "prisma-orpc-generator"
            "prisma-valibot-generator"
            "@drzl/cli"
            "@drzl/analyzer"
            "@drzl/generator-zod"
            "@drzl/generator-valibot"
            "@drzl/generator-arktype"
            "@drzl/generator-service"
            "@drzl/generator-orpc"
            "@drzl/validation-core"
            "@drzl/template-orpc-service"
            "@drzl/template-standard"
          )

          total_downloads=0
          weekly_downloads=0

          echo "📦 Calculating download statistics..."

          for package in "${packages[@]}"; do
            echo "Checking downloads for $package..."
            downloads=$(curl -s "https://api.npmjs.org/downloads/range/2000-01-01:$(date +%Y-%m-%d)/$package" | node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (data.downloads) {
                const total = data.downloads.reduce((sum, day) => sum + day.downloads, 0);
                console.log(total);
              } else {
                console.log(0);
              }
            ")

            weekly=$(curl -s "https://api.npmjs.org/downloads/point/last-week/$package" | node -e "
              try {
                const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
                console.log(data.downloads || 0);
              } catch { console.log(0); }
            ")

            if [ "$downloads" != "0" ]; then
              echo "  → $downloads all-time, $weekly last week"
              total_downloads=$((total_downloads + downloads))
              weekly_downloads=$((weekly_downloads + weekly))
            else
              echo "  → Package not found or no data"
            fi
          done

          commas() { echo "$1" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta'; }

          # Rounded down to a round number: the README says "around N a week", and a figure like
          # 112,409 implies a precision that a weekly average does not have.
          if [ "$weekly_downloads" -ge 10000 ]; then
            weekly_rounded=$(( weekly_downloads / 1000 * 1000 ))
          else
            weekly_rounded=$weekly_downloads
          fi

          formatted_downloads=$(commas "$total_downloads")
          formatted_weekly=$(commas "$weekly_rounded")

          echo "🎉 Total: $formatted_downloads all-time, $formatted_weekly a week"
          echo "downloads=$total_downloads" >> $GITHUB_OUTPUT
          echo "formatted_downloads=$formatted_downloads" >> $GITHUB_OUTPUT
          echo "formatted_weekly=$formatted_weekly" >> $GITHUB_OUTPUT

      - name: Update README with download count
        env:
          WEEKLY: ${{ steps.downloads.outputs.formatted_weekly }}
        run: |
          echo "${{ steps.downloads.outputs.downloads }}" > download_count.txt

          # Replace between markers rather than pattern-matching the prose. The previous version used
          # `sed "s/...\*\*[0-9,]*K\+ downloads\*\*/..."`, where `\+` is GNU's one-or-more quantifier
          # rather than a literal plus — so it read as "one or more K" and never matched "878K+".
          # The figure sat frozen for months while the badge, patched by a separate expression, moved on.
          if ! grep -q "WEEKLY-DOWNLOADS:START" README.md; then
            echo "::error::The WEEKLY-DOWNLOADS markers are missing from README.md — nothing to update."
            exit 1
          fi

          # Single-quoted so perl, not bash, expands $ENV{WEEKLY}.
          perl -0pi -e 's/(<!-- WEEKLY-DOWNLOADS:START -->).*?(<!-- WEEKLY-DOWNLOADS:END -->)/$1$ENV{WEEKLY}$2/s' README.md

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet README.md download_count.txt; then
            echo "No changes to commit"
          else
            echo "Updated: ${WEEKLY} downloads a week"
            git add README.md download_count.txt
            git commit -m "chore: update download stats to ${WEEKLY} a week"
            git push
          fi
